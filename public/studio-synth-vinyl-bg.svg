<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none">
  <defs>
    <linearGradient id="booth-bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080B12" />
      <stop offset="100%" stop-color="#040609" />
    </linearGradient>
    <linearGradient id="vinyl-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="50%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#B855FF" />
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#booth-bg)" />

  <!-- Acoustic Pyramid Panel Grid -->
  <g stroke="#1E293B" stroke-width="1.2" opacity="0.45">
    <path d="M0 150 H1600 M0 300 H1600 M0 450 H1600 M0 600 H1600 M0 750 H1600" />
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900" />
  </g>

  <!-- Left Turntable Platter -->
  <g transform="translate(380, 450)">
    <rect x="-260" y="-260" width="520" height="520" rx="28" fill="#0B101B" stroke="#1E293B" stroke-width="3" />
    <circle cx="0" cy="0" r="210" fill="#05080F" stroke="url(#vinyl-glow)" stroke-width="2.5" stroke-dasharray="8 6" />
    <circle cx="0" cy="0" r="165" stroke="#334155" stroke-width="1.5" />
    <circle cx="0" cy="0" r="120" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="0" cy="0" r="62" fill="#111827" stroke="#00D4FF" stroke-width="2" />
    <circle cx="0" cy="0" r="12" fill="#F8FAFC" />
  </g>

  <!-- Right Turntable Platter -->
  <g transform="translate(1220, 450)">
    <rect x="-260" y="-260" width="520" height="520" rx="28" fill="#0B101B" stroke="#1E293B" stroke-width="3" />
    <circle cx="0" cy="0" r="210" fill="#05080F" stroke="#FF2A54" stroke-width="2.5" stroke-dasharray="8 6" stroke-opacity="0.7" />
    <circle cx="0" cy="0" r="165" stroke="#334155" stroke-width="1.5" />
    <circle cx="0" cy="0" r="120" stroke="#1E293B" stroke-width="1.5" />
    <circle cx="0" cy="0" r="62" fill="#111827" stroke="#B855FF" stroke-width="2" />
    <circle cx="0" cy="0" r="12" fill="#F8FAFC" />
  </g>

  <!-- Center Club Mixer Unit -->
  <g transform="translate(670, 190)">
    <rect x="0" y="0" width="260" height="520" rx="18" fill="#090D16" stroke="#334155" stroke-width="3" />
    <circle cx="65" cy="80" r="18" fill="#0F172A" stroke="#00FF66" stroke-width="2" />
    <circle cx="130" cy="80" r="18" fill="#0F172A" stroke="#00D4FF" stroke-width="2" />
    <circle cx="195" cy="80" r="18" fill="#0F172A" stroke="#B855FF" stroke-width="2" />
    <circle cx="65" cy="145" r="18" fill="#0F172A" stroke="#00FF66" stroke-width="2" />
    <circle cx="130" cy="145" r="18" fill="#0F172A" stroke="#00D4FF" stroke-width="2" />
    <circle cx="195" cy="145" r="18" fill="#0F172A" stroke="#FF2A54" stroke-width="2" />
    <line x1="65" y1="240" x2="65" y2="410" stroke="#475569" stroke-width="4" />
    <line x1="130" y1="240" x2="130" y2="410" stroke="#475569" stroke-width="4" />
    <line x1="195" y1="240" x2="195" y2="410" stroke="#475569" stroke-width="4" />
    <line x1="70" y1="465" x2="190" y2="465" stroke="#00D4FF" stroke-width="4" />
  </g>
</svg>
